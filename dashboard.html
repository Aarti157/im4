<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YumYum – Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream:       #F7ECCA;
      --cream-alt:   #F3E3B7;
      --sand:        #B7AD8F;
      --sand-border: rgba(183,173,143,0.30);
      --olive:       #60583F;
      --pink:        #E984A4;
      --pink-hover:  #d4608a;
      --blue:        #7D8ECC;
      --white-card:  #fdfaf2;
      --text:        #2e2a1e;
      --text-muted:  #60583F;
      --text-faint:  #B7AD8F;
      --radius-md:   10px;
      --radius-lg:   16px;
      --radius-xl:   24px;
      --radius-pill: 9999px;
      --font-serif:  "Libre Baskerville", Georgia, serif;
      --font-sans:   "Inter", system-ui, sans-serif;
    }
    html { -webkit-font-smoothing: antialiased; }
    body { font-family: var(--font-sans); background: var(--cream); color: var(--text); min-height: 100dvh; }

    /* ── NAV ── */
    .nav {
      background: var(--cream);
      border-bottom: 1px solid var(--sand-border);
      padding: 0.9rem 2.5rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo img { height: 56px; width: auto; display: block; }
    .nav-right { display: flex; align-items: center; gap: 1.2rem; }
    .nav-user { font-size: 0.85rem; color: var(--text-muted); }
    .nav-user span { font-weight: 600; color: var(--text); }
    .nav-orga { font-size: 0.75rem; color: var(--text-faint); }
    .btn-logout {
      background: none; border: 1px solid var(--sand-border);
      border-radius: var(--radius-md); padding: 0.45rem 0.9rem;
      font-family: var(--font-sans); font-size: 0.8rem;
      color: var(--text-muted); cursor: pointer; text-decoration: none;
      transition: background 140ms;
    }
    .btn-logout:hover { background: var(--cream-alt); }

    /* ── LAYOUT ── */
    .dashboard-wrap { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem 5rem; }
    .page-title { font-family: var(--font-serif); font-size: clamp(1.6rem, 2.5vw, 2.2rem); font-weight: 700; color: var(--text); margin-bottom: 0.3rem; }
    .page-sub { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 2.5rem; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; }
    .section-title { font-family: var(--font-serif); font-size: 1.15rem; font-weight: 700; color: var(--text); }

    /* ── WOCHENPLAN ── */
    .woche-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
      margin-bottom: 3rem;
    }
    .tag-karte {
      background: var(--white-card);
      border: 1px solid var(--sand-border);
      border-radius: var(--radius-xl);
      padding: 1.4rem 1.2rem 1.2rem;
      cursor: pointer;
      transition: box-shadow 150ms, transform 130ms, border-color 150ms;
      display: flex; flex-direction: column; gap: 0.6rem;
      min-height: 190px;
    }
    .tag-karte:hover { box-shadow: 0 4px 18px rgba(96,88,63,0.13); transform: translateY(-2px); border-color: var(--pink); }
    .tag-karte.leer { cursor: default; }
    .tag-karte.leer:hover { transform: none; box-shadow: none; border-color: var(--sand-border); }
    .tag-header { display: flex; align-items: center; justify-content: space-between; }
    .tag-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-faint); }
    .tag-datum { font-size: 0.68rem; color: var(--text-faint); }
    .gericht-name { font-family: var(--font-serif); font-size: 0.92rem; font-weight: 700; color: var(--text); line-height: 1.3; }
    .gericht-desc { font-size: 0.76rem; color: var(--text-muted); line-height: 1.5; }
    .gericht-badges { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: auto; }
    .gbadge { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.15rem 0.4rem; border-radius: 4px; background: rgba(125,142,204,0.15); color: var(--olive); }
    .kein-gericht { font-size: 0.78rem; color: var(--text-faint); font-style: italic; margin: auto 0; }
    .bewertung-bar { margin-top: auto; }
    .bar-track { height: 5px; border-radius: 3px; background: rgba(183,173,143,0.2); display: flex; overflow: hidden; }
    .bar-pink  { background: var(--pink); height: 100%; transition: width 400ms ease; }
    .bar-blue  { background: var(--blue); height: 100%; transition: width 400ms ease; }
    .bar-sand  { background: var(--sand); height: 100%; transition: width 400ms ease; }
    .bar-labels { display: flex; justify-content: space-between; margin-top: 0.35rem; }
    .bar-label { font-size: 0.65rem; color: var(--text-faint); }

    /* ── GERICHTSERFASSUNG ── */
    .erfassung-section { background: var(--cream-alt); border-radius: var(--radius-xl); padding: 2rem 2.2rem; }
    .erfassung-title { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 1.4rem; }
    .erfassung-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .field-full { grid-column: 1 / -1; }
    .field { display: flex; flex-direction: column; gap: 0.4rem; }
    .field label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); }
    .field input, .field textarea {
      background: var(--white-card); border: 1.5px solid var(--sand-border);
      border-radius: var(--radius-md); padding: 0.65rem 0.9rem;
      font-family: var(--font-sans); font-size: 0.88rem; color: var(--text);
      outline: none; transition: border-color 140ms; width: 100%;
    }
    .field input:focus, .field textarea:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(233,132,164,0.15); }
    .field textarea { resize: vertical; min-height: 80px; }
    .badges-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .badge-check { display: none; }
    .badge-check + label {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 0.3rem 0.65rem; border-radius: 7px; border: 1.5px solid var(--sand-border);
      color: var(--text-muted); cursor: pointer; transition: all 140ms; background: var(--white-card);
    }
    .badge-check:checked + label { background: rgba(125,142,204,0.2); border-color: var(--blue); color: var(--olive); }
    .btn-primary { background: var(--pink); color: #fff; border: none; border-radius: var(--radius-pill); padding: 0.7rem 1.6rem; font-family: var(--font-sans); font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: background 140ms, transform 120ms; }
    .btn-primary:hover { background: var(--pink-hover); transform: translateY(-1px); }
    .btn-submit-row { display: flex; justify-content: flex-end; margin-top: 1.4rem; }

    /* ── BEWERTUNGS-MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(48,40,20,0.4); backdrop-filter: blur(4px);
      z-index: 400; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--white-card); border-radius: var(--radius-xl);
      padding: 2.2rem; width: 100%; max-width: 420px;
      box-shadow: 0 8px 40px rgba(48,40,20,0.18); position: relative;
    }
    .modal-box h2 { font-family: var(--font-serif); font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 1.4rem; }
    .modal-close { position: absolute; top: 1.2rem; right: 1.2rem; background: none; border: none; cursor: pointer; color: var(--text-faint); font-size: 1.1rem; line-height: 1; padding: 0.2rem; }
    .modal-close:hover { color: var(--text); }
    .bew-scores { display: grid; grid-template-columns: repeat(3,1fr); gap: 0.8rem; margin-bottom: 1rem; }
    .bew-score-item { border-radius: var(--radius-lg); padding: 1rem 0.5rem; text-align: center; }
    .bew-score-num { font-family: var(--font-serif); font-size: 1.8rem; font-weight: 700; }
    .bew-score-label { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.2rem; }
    .bew-score-item.pink { background: rgba(233,132,164,0.15); }
    .bew-score-item.pink .bew-score-num { color: var(--pink); }
    .bew-score-item.blue { background: rgba(125,142,204,0.15); }
    .bew-score-item.blue .bew-score-num { color: var(--blue); }
    .bew-score-item.sand { background: rgba(183,173,143,0.2); }
    .bew-score-item.sand .bew-score-num { color: var(--olive); }
    .bew-total { font-size: 0.82rem; color: var(--text-muted); text-align: center; }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) { .woche-grid { grid-template-columns: repeat(3,1fr); } }
    @media (max-width: 640px) {
      .woche-grid { grid-template-columns: 1fr 1fr; }
      .erfassung-grid { grid-template-columns: 1fr; }
      .field-full { grid-column: auto; }
      .nav { padding: 0.8rem 1.2rem; }
      .dashboard-wrap { padding: 1.5rem 1rem 3rem; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a href="index.html" class="nav-logo">
    <img src="img/logo_yumyum.png" alt="YumYum" />
  </a>
  <div class="nav-right">
    <div>
      <div class="nav-user">Hallo, <span id="userName">–</span></div>
      <div class="nav-orga" id="userOrga"></div>
    </div>
    <button class="btn-logout" id="logoutBtn">Abmelden</button>
  </div>
</nav>

<div class="dashboard-wrap">

  <h1 class="page-title">Dashboard</h1>
  <p class="page-sub">Übersicht und Verwaltung des Wochenmenüs</p>

  <!-- WOCHENPLAN -->
  <div class="section-header">
    <span class="section-title">Wochenplan</span>
  </div>
  <div id="wocheContainer" class="woche-grid">
    <p style="color:var(--text-faint);font-size:.85rem;">Lädt…</p>
  </div>

  <!-- GERICHTSERFASSUNG -->
  <div class="erfassung-section">
    <div class="erfassung-title">Gericht erfassen</div>
    <form id="gerichtForm">
      <div class="erfassung-grid">
        <div class="field">
          <label for="gerichtDatum">Datum</label>
          <input type="date" id="gerichtDatum" required />
        </div>
        <div class="field">
          <label for="gerichtName">Name des Gerichts</label>
          <input type="text" id="gerichtName" placeholder="z.B. Pasta Napoli" required />
        </div>
        <div class="field field-full">
          <label for="gerichtDesc">Beschreibung</label>
          <textarea id="gerichtDesc" maxlength="250" placeholder="Kurze Beschreibung (optional)"></textarea>
        </div>
        <div class="field field-full">
          <label>Spezielles</label>
          <div class="badges-row">
            <input type="checkbox" class="badge-check" id="cb-vg" name="vegan"><label for="cb-vg">Vegan</label>
            <input type="checkbox" class="badge-check" id="cb-v"  name="vegetarisch"><label for="cb-v">Vegetarisch</label>
            <input type="checkbox" class="badge-check" id="cb-p"  name="pescetarisch"><label for="cb-p">Pescetarisch</label>
            <input type="checkbox" class="badge-check" id="cb-gf" name="glutenfrei"><label for="cb-gf">Glutenfrei</label>
            <input type="checkbox" class="badge-check" id="cb-lf" name="laktosefrei"><label for="cb-lf">Laktosefrei</label>
            <input type="checkbox" class="badge-check" id="cb-zf" name="zuckerfrei"><label for="cb-zf">Zuckerfrei</label>
            <input type="checkbox" class="badge-check" id="cb-sf" name="sojafrei"><label for="cb-sf">Sojafrei</label>
          </div>
        </div>
      </div>
      <div class="btn-submit-row">
        <button type="submit" class="btn-primary">Gericht erfassen</button>
      </div>
    </form>
  </div>

</div>

<!-- BEWERTUNGS-MODAL -->
<div class="modal-overlay" id="bewertungModal">
  <div class="modal-box">
    <button class="modal-close" id="bewertungModalClose">✕</button>
    <h2>Bewertungen — <span id="bewertungDatum"></span></h2>
    <div class="bew-scores">
      <div class="bew-score-item pink">
        <div class="bew-score-num" id="bewertungGood">–</div>
        <div class="bew-score-label">😊 Yum</div>
      </div>
      <div class="bew-score-item blue">
        <div class="bew-score-num" id="bewertungNeutral">–</div>
        <div class="bew-score-label">😐 Naja</div>
      </div>
      <div class="bew-score-item sand">
        <div class="bew-score-num" id="bewertungBad">–</div>
        <div class="bew-score-label">😕 Nicht Yum</div>
      </div>
    </div>
    <p class="bew-total">Gesamt: <strong id="bewertungTotal">–</strong> Bewertungen</p>
  </div>
</div>

<script src="js/dashboard.js"></script>
<script src="js/logout.js"></script>
</body>
</html>
