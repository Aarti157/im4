<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Register</h1>

    <form id="registerForm">
      <div>
        <label>Email</label>
        <input type="email" id="email" required />
      </div>
      <div>
        <label>Name</label>
        <input type="text" id="name" required />
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="password" required />
      </div>
      <select id="rollen_id" required>
        <option value="" disabled selected>Rolle auswählen</option>
        <option value="1">Eltern</option>
        <option value="2">Erzieher:innen</option>
        <option value="3">Küche</option>
      </select>
      
      <select id="orga_id" required>
        <option value="" disabled selected>Organisation auswählen</option>
        <option value="1">Kindergarten Limmat</option>
        <option value="2">Kindergarten Zollstrasse</option>
        <option value="3">Kindergarten Kappeli</option>
        <option value="4">Kindergarten Bullingerhof</option>
        <option value="5">Kindergarten Holunderhof</option>
      </select>
      <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="login.html">Login here</a>.</p>

    <script src="js/register.js"></script>
  </body>
</html>
