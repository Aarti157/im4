<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YumYum – Kontakt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #F7ECCA; --cream-dark: #ede0b4; --sand: #B7AD8F;
      --sand-border: rgba(183,173,143,0.30); --olive: #60583F;
      --pink: #E984A4; --pink-hover: #d4608a;
      --white-card: #fdfaf2; --text: #2e2a1e;
      --text-muted: #60583F; --text-faint: #B7AD8F;
      --radius-md: 10px; --radius-xl: 24px; --radius-pill: 9999px;
      --shadow-card: 0 4px 24px rgba(96,88,63,0.10);
      --font-serif: 'Libre Baskerville', Georgia, serif;
      --font-sans: 'Inter', system-ui, sans-serif;
      --transition: 150ms cubic-bezier(0.16,1,0.3,1);
    }
    html { -webkit-font-smoothing: antialiased; }
    body { font-family: var(--font-sans); background: var(--cream); color: var(--text); min-height: 100dvh; display: flex; flex-direction: column; font-size: 1rem; line-height: 1.6; }
    .back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: var(--text-muted); text-decoration: none; padding: 1.4rem 1.6rem 0; }
    .back-link:hover { color: var(--olive); }
    .auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 1.5rem 1rem 3rem; }
    .auth-card { background: var(--white-card); border-radius: var(--radius-xl); padding: 2.8rem 2.4rem; width: 100%; max-width: 480px; box-shadow: var(--shadow-card); }
    .auth-card h1 { font-family: var(--font-serif); font-size: 1.9rem; font-weight: 700; color: var(--text); text-align: center; margin-bottom: 0.5rem; }
    .auth-sub { font-size: 0.88rem; color: var(--text-faint); text-align: center; margin-bottom: 2rem; line-height: 1.5; }
    .field { margin-bottom: 1.2rem; }
    .field label { display: block; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.45rem; }
    .field input, .field textarea { width: 100%; background: var(--cream); border: 1.5px solid var(--sand-border); border-radius: var(--radius-md); padding: 0.75rem 1rem; font-family: var(--font-sans); font-size: 0.92rem; color: var(--text); outline: none; transition: border-color 140ms ease, box-shadow 140ms ease; resize: vertical; }
    .field input::placeholder, .field textarea::placeholder { color: var(--text-faint); }
    .field input:focus, .field textarea:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(233,132,164,0.22); }
    .field textarea { min-height: 120px; }
    .btn-submit { display: block; width: 100%; background: #F59E1E; color: var(--olive); border: none; border-radius: var(--radius-pill); padding: 0.85rem; font-family: var(--font-sans); font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 1.4rem; transition: background 140ms ease, transform 120ms ease; }
    .btn-submit:hover { background: #f7b84b; transform: translateY(-1px); }
  
    .contact-cards { display: flex; flex-direction: column; gap: 0.8rem; margin: 1.6rem 0; }
    .contact-card { display: flex; align-items: center; gap: 1.2rem; background: var(--white-card); border: 1px solid var(--sand-border); border-radius: var(--radius-lg); padding: 1.1rem 1.4rem; text-decoration: none; transition: box-shadow 140ms ease, transform 120ms ease; }
    .contact-card:hover { box-shadow: 0 4px 16px rgba(96,88,63,0.10); transform: translateY(-1px); }
    .contact-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .contact-info { display: flex; flex-direction: column; gap: 0.15rem; }
    .contact-label { font-size: 0.75rem; color: var(--text-faint); font-weight: 500; }
    .contact-value { font-size: 1rem; font-weight: 600; color: var(--text); }
    .contact-footer-note { font-size: 0.82rem; color: var(--text-faint); line-height: 1.6; margin-top: 0.5rem; text-align: center; }

  </style>
</head>
<body>
  <a href="index.html" class="back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Zurück zur Startseite
  </a>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Kontakt</h1>
      <p class="auth-sub">Fragen, Feedback oder Interesse an einer Demo? Wir freuen uns von Ihnen zu hören.</p>

      <!-- Kontakt-Karten -->
      <div class="contact-cards">
        <a href="mailto:hoi@yumyum.ch" class="contact-card">
          <div class="contact-icon" style="background:rgba(245,158,30,0.15);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F59E1E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <div class="contact-info">
            <span class="contact-label">E-Mail</span>
            <span class="contact-value">hoi@yumyum.ch</span>
          </div>
        </a>
        <a href="tel:+41441112233" class="contact-card">
          <div class="contact-icon" style="background:rgba(125,142,204,0.15);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7D8ECC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.07 11.9 19.79 19.79 0 0 1 1 3.18 2 2 0 0 1 2.98 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6.06 6.06l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </div>
          <div class="contact-info">
            <span class="contact-label">Telefon</span>
            <span class="contact-value">+41 44 111 22 33</span>
          </div>
        </a>
        <a href="https://www.instagram.com" target="_blank" class="contact-card">
          <div class="contact-icon" style="background:rgba(212,114,111,0.15);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D4726F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
          </div>
          <div class="contact-info">
            <span class="contact-label">Instagram</span>
            <span class="contact-value">@yumyum</span>
          </div>
        </a>
      </div>

      <p class="contact-footer-note">Wir freuen uns darauf, von Ihnen zu hören! Unser Team antwortet in der Regel innerhalb von 24 Stunden.</p>

      <h2 style="font-family:var(--font-serif);font-size:1.1rem;font-weight:700;color:var(--text);margin-top:2rem;margin-bottom:1rem;text-align:center;">Kontaktformular</h2>
      <form>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Ihr vollständiger Name" required />
        </div>
        <div class="field">
          <label for="email">E-Mail</label>
          <input type="email" id="email" placeholder="ihre@email.de" required />
        </div>
        <div class="field">
          <label for="nachricht">Nachricht</label>
          <textarea id="nachricht" placeholder="Ihre Nachricht…" required></textarea>
        </div>
        <button type="submit" class="btn-submit">Nachricht senden</button>
      </form>
    </div>
  </div>
</body>
</html>
